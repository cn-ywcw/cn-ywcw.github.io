# ======================
# 博客核心配置（OIer 精简版）
# ======================
locale                   : "zh-CN"
site_theme               : "default"
title                    : "cn-ywcw"
title_separator          : "-"
name                     : &name "ywcw"
description              : &description "OIer ｜ 算法竞赛 ｜ 学习记录"
url                      : https://cn-ywcw.github.io
baseurl                  : ""
repository               : "cn-ywcw/cn-ywcw.github.io"

# ======================
# 作者（侧边栏）
# ======================
author:
  avatar                 : "profile.png"
  name                   : "ywcw"
  bio                    : "OIer，喜欢算法和推理"
  location               : "China"
  email                  : ""

  # 社交（只保留你真正用的）
  github                 : "cn-ywcw"
  bluesky                : ""
  twitter                : ""

# ======================
# 博客通用行为
# ======================
teaser                   : ""
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "enabled"
comments:
  provider               : false

# ======================
# SEO & 社交（可留空）
# ======================
twitter:
  username               : ""
facebook:
  username               : ""
og_image                 : ""
social:
  type                   : "Person"
  name                   : "ywcw"

analytics:
  provider               : false

# ======================
# 文件处理
# ======================
include:
  - .htaccess
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "md"

# ======================
# Markdown 渲染
# ======================
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# ======================
# 集合（博客足以，减少复杂度）
# ======================
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

# ======================
# 默认布局
# ======================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# ======================
# 输出与分页（暂不分页）
# ======================
permalink: /:year/:month/:day/:title/
timezone: Asia/Shanghai

# ======================
# 插件（安全且通用）
# ======================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# ======================
# 归档（按标签 / 分类）
# ======================
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# ======================
# HTML 压缩（保持开发可读）
# ======================
compress_html:
  clippings: all
  ignore:
    envs: development
